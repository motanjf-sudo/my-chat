<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coding</title>
<link rel="icon" href="/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<style>
:root{--green-dark:#14532d;--green-main:#16a34a;--green-mid:#22c55e;--green-light:#dcfce7;--green-pale:#f0fdf4;--green-border:#bbf7d0;
  --gray-50:#f9fafb;--gray-100:#f3f4f6;--gray-200:#e5e7eb;--gray-400:#9ca3af;--gray-600:#4b5563;--gray-800:#1f2937;--red:#dc2626;--amber:#b45309}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Vazirmatn',Tahoma,sans-serif;background:#f8fafc;color:var(--gray-800);display:flex;flex-direction:column;overflow:hidden}
button,select,input,textarea{font-family:inherit;font-size:.82rem;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.45;cursor:default}

/* top bar */
#top{display:flex;align-items:center;gap:10px;padding:8px 14px;background:#fff;border-bottom:1px solid var(--gray-200);flex-wrap:wrap}
#top a.back{color:var(--green-main);text-decoration:none;font-weight:600;font-size:.85rem}
#top h1{font-size:1rem;color:var(--green-dark);flex:1;min-width:90px}
.sel{background:#fff;border:1px solid var(--gray-200);border-radius:8px;padding:6px 8px;outline:none;max-width:210px}
.sel:focus{border-color:var(--green-main)}
.btn{background:#fff;border:1px solid var(--gray-200);border-radius:8px;padding:6px 11px;color:var(--gray-600);transition:.15s;white-space:nowrap}
.btn:hover:not(:disabled){border-color:var(--green-main);color:var(--green-main);background:var(--green-pale)}
.btn.primary{background:var(--green-main);border-color:var(--green-main);color:#fff;font-weight:600}
.btn.primary:hover:not(:disabled){background:var(--green-dark);color:#fff}
.btn.danger:hover:not(:disabled){border-color:#fca5a5;color:var(--red);background:#fff5f5}
#tabs{display:none}

/* two halves (code left, AI right; LTR container so the editor is always on the left) */
#work{flex:1;min-height:0;display:flex;direction:ltr}
#work.swap{flex-direction:row-reverse}
.pane{display:flex;flex-direction:column;min-width:0;min-height:0;background:#fff}
#edPane{flex:0 0 50%}
#aiPane{flex:1 1 0;direction:rtl;background:#fcfdfc}
#split{flex:0 0 6px;background:var(--gray-200);cursor:col-resize;transition:background .15s}
#split:hover,#split.drag{background:var(--green-mid)}

/* editor side */
#edBar{display:flex;gap:6px;align-items:center;padding:7px 10px;border-bottom:1px solid var(--gray-200);background:var(--gray-50);flex-wrap:wrap;direction:rtl}
#edBar .sp{flex:1}
#edBox{flex:1 1 0;min-height:120px;position:relative;direction:ltr}
#edBox .CodeMirror{height:100%;font-family:'Cascadia Code','Fira Code',Consolas,Menlo,monospace;font-size:13px;direction:ltr;text-align:left}
#edBox textarea#plain{width:100%;height:100%;border:0;outline:0;resize:none;padding:10px;font-family:Consolas,Menlo,monospace;font-size:13px;direction:ltr;text-align:left;tab-size:2;white-space:pre}
.cm-ai-changed{background:rgba(34,197,94,.28);transition:background 1.2s}
.cm-ai-fade{background:transparent}
#edMeta{display:flex;gap:12px;padding:3px 10px;font-size:.72rem;color:var(--gray-400);border-top:1px solid var(--gray-100);direction:rtl}
#out{flex:0 0 auto;border-top:2px solid var(--gray-200);display:flex;flex-direction:column;height:34%;min-height:90px;background:#fff;direction:rtl}
#out.collapsed{height:auto!important;min-height:0}
#out.collapsed #outBody{display:none}
#outBar{display:flex;align-items:center;gap:8px;padding:5px 10px;background:var(--gray-50);font-size:.78rem;color:var(--gray-600)}
#outBar b{color:var(--green-dark)}#outBar .sp{flex:1}
#outBar button{background:none;border:0;color:var(--gray-600);padding:2px 6px;border-radius:6px}
#outBar button:hover{background:var(--gray-200)}
#outBody{flex:1;min-height:0;display:flex;flex-direction:column}
#preview{flex:1;min-height:0;border:0;width:100%;background:#fff;display:none}
#out.html #preview{display:block}
#con{overflow:auto;font-family:Consolas,Menlo,monospace;font-size:12.5px;padding:6px 10px;direction:ltr;text-align:left;flex:1;min-height:40px}
#out.html #con{flex:0 0 70px;border-top:1px solid var(--gray-200)}
#con div{white-space:pre-wrap;word-break:break-word;padding:1px 0}
#con .err{color:var(--red)}#con .warn{color:var(--amber)}#con .status{color:var(--gray-400)}
#con .empty{color:var(--gray-400);font-family:'Vazirmatn',sans-serif;direction:rtl}

/* AI side */
#aiBar{display:flex;gap:8px;align-items:center;padding:7px 10px;border-bottom:1px solid var(--gray-200);background:var(--gray-50);font-size:.78rem;color:var(--gray-600);flex-wrap:wrap}
#aiBar .sp{flex:1}
#aiBar label{display:flex;gap:4px;align-items:center;cursor:pointer}
#msgs{flex:1;min-height:0;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.m{max-width:94%;padding:9px 12px;border-radius:14px;line-height:1.9;font-size:.88rem;word-break:break-word}
.m.u{align-self:flex-start;background:var(--green-main);color:#fff;border-bottom-right-radius:4px;white-space:pre-wrap}
.m.a{align-self:flex-end;background:#fff;border:1px solid var(--gray-200);border-bottom-left-radius:4px}
.m.a p{margin:0 0 .4em}.m.a p:last-child{margin:0}
.m.a pre{direction:ltr;text-align:left;background:#0f172a;color:#e2e8f0;padding:9px 11px;border-radius:9px;overflow:auto;font-size:12.5px;margin:6px 0}
.m.a code{background:var(--gray-100);padding:1px 5px;border-radius:5px;font-family:Consolas,monospace;direction:ltr;unicode-bidi:embed;font-size:.84em}
.m.a pre code{background:none;padding:0;color:inherit}
.m.err{border-color:#fca5a5;background:#fff5f5;color:#991b1b}
.m.sys{align-self:center;background:var(--green-pale);border:1px dashed var(--green-border);color:var(--gray-600);font-size:.8rem;text-align:center}
.think{color:var(--gray-400);font-size:.8rem}
.wr{display:inline-block;background:var(--green-light);color:var(--green-dark);border-radius:8px;padding:2px 9px;font-size:.78rem;margin:3px 0}
.card{margin-top:8px;border:1px solid var(--green-border);background:var(--green-pale);border-radius:11px;padding:8px 10px;font-size:.8rem}
.card.bad{border-color:#fca5a5;background:#fff5f5}
.card .row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.card .row b{color:var(--green-dark)}.card.bad .row b{color:#991b1b}
.card .row .sp{flex:1}
.card button{background:#fff;border:1px solid var(--gray-200);border-radius:7px;padding:3px 9px;font-size:.76rem}
.card button:hover{border-color:var(--green-main);color:var(--green-main)}
.diff{direction:ltr;text-align:left;margin-top:7px;font-family:Consolas,monospace;font-size:12px;max-height:230px;overflow:auto;background:#fff;border:1px solid var(--gray-200);border-radius:8px}
.diff div{white-space:pre;padding:0 8px}
.diff .add{background:#dcfce7;color:#14532d}.diff .del{background:#fee2e2;color:#7f1d1d}.diff .ctx{color:var(--gray-400)}
#chips{display:flex;gap:6px;flex-wrap:wrap;padding:6px 10px 0}
#chips button{background:#fff;border:1px solid var(--gray-200);border-radius:99px;padding:3px 11px;font-size:.76rem;color:var(--gray-600)}
#chips button:hover:not(:disabled){border-color:var(--green-main);color:var(--green-main);background:var(--green-pale)}
#chips button.fix{border-color:#fca5a5;color:var(--red)}
#ctxNote{padding:3px 12px;font-size:.72rem;color:var(--gray-400)}
#inBar{display:flex;gap:8px;padding:8px 10px 12px;align-items:flex-end}
#inp{flex:1;resize:none;border:1.5px solid var(--gray-200);border-radius:12px;padding:9px 12px;outline:none;max-height:150px;min-height:42px;line-height:1.7;background:#fff}
#inp:focus{border-color:var(--green-main);box-shadow:0 0 0 3px rgba(34,197,94,.14)}
#send{height:42px;padding:0 18px;border-radius:12px}
#send.stop{background:var(--red);border-color:var(--red)}

/* phone: one half at a time */
@media(max-width:820px){
  #tabs{display:flex;gap:6px;padding:6px 10px;background:#fff;border-bottom:1px solid var(--gray-200)}
  #tabs button{flex:1;padding:7px;border:1px solid var(--gray-200);border-radius:9px;background:#fff}
  #tabs button.on{background:var(--green-main);border-color:var(--green-main);color:#fff;font-weight:600}
  #work{flex-direction:column!important}
  #split,#swapBtn{display:none}
  #edPane,#aiPane{flex:1 1 0!important}
  body[data-tab="code"] #aiPane{display:none}
  body[data-tab="ai"] #edPane{display:none}
  #top h1{display:none}
}
</style>
</head>
<body data-tab="code">
<div id="top">
  <a class="back" href="/">→ چت</a>
  <h1>💻 Coding</h1>
  <select id="model" class="sel" aria-label="مدل هوش مصنوعی"></select>
  <button class="btn" id="swapBtn" type="button" title="جابجایی پنل‌ها">⇄</button>
</div>
<div id="tabs"><button type="button" data-t="code" class="on">✏️ کد</button><button type="button" data-t="ai">🤖 هوش مصنوعی</button></div>

<div id="work">
  <section class="pane" id="edPane">
    <div id="edBar">
      <select id="lang" class="sel" aria-label="زبان"></select>
      <button class="btn primary" id="runBtn" type="button">▶ اجرا</button>
      <button class="btn" id="dlBtn" type="button">⬇ دانلود</button>
      <button class="btn" id="cpBtn" type="button">📋 کپی</button>
      <button class="btn" id="openBtn" type="button">📂 باز کردن فایل</button>
      <span class="sp"></span>
      <button class="btn danger" id="newBtn" type="button">🗑 جدید</button>
      <input type="file" id="fileIn" hidden>
    </div>
    <div id="edBox"></div>
    <div id="edMeta"><span id="mLines">۰ خط</span><span id="mSel"></span></div>
    <div id="out" class="collapsed">
      <div id="outBar"><b>خروجی</b><span id="outSt"></span><span class="sp"></span><button type="button" id="outClear">پاک کردن</button><button type="button" id="outTog">▲</button></div>
      <div id="outBody"><iframe id="preview" sandbox="allow-scripts allow-modals allow-forms allow-popups" title="پیش‌نمایش"></iframe><div id="con"></div></div>
    </div>
  </section>
  <div id="split" title="بکش تا اندازه عوض شود"></div>
  <section class="pane" id="aiPane">
    <div id="aiBar"><b>🤖 هوش مصنوعی</b><span class="sp"></span><label title="مدل بیشتر فکر می‌کند؛ کندتر ولی دقیق‌تر"><input type="checkbox" id="deep"> تفکر بیشتر</label><button class="btn" id="aiClear" type="button">گفتگوی جدید</button></div>
    <div id="msgs"></div>
    <div id="chips"></div>
    <div id="ctxNote"></div>
    <div id="inBar"><textarea id="inp" rows="1" placeholder="بگو چه کاری روی کد انجام بدهم… (Enter = ارسال)"></textarea><button class="btn primary" id="send" type="button">ارسال</button></div>
  </section>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script>
(function () {
  'use strict';
  const $ = id => document.getElementById(id);
  const CM_BASE = 'https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/';
  const PYODIDE_URL = 'https://cdn.jsdelivr.net/pyodide/v314.0.7/full/pyodide.js';
  const MAX_CODE = 80000;

  const LANGS = [
    { id: 'html', label: 'HTML / CSS / JS', name: 'HTML', file: 'index.html', mime: 'htmlmixed', run: 'html', ext: ['html', 'htm'],
      rule: 'It is ONE self-contained HTML file (inline <style> and <script>) that runs in a browser preview.' },
    { id: 'python', label: 'Python', name: 'Python', file: 'main.py', mime: 'python', run: 'py', ext: ['py'],
      rule: 'It runs in the browser with Pyodide: use print(), no input(), threads, sockets or files.' },
    { id: 'javascript', label: 'JavaScript', name: 'JavaScript', file: 'script.js', mime: 'javascript', run: 'js', ext: ['js', 'mjs'],
      rule: 'It runs in a browser console sandbox: console.log() for output; no Node-only APIs (require, fs, process).' },
    { id: 'typescript', label: 'TypeScript', name: 'TypeScript', file: 'main.ts', mime: { name: 'javascript', typescript: true }, ext: ['ts'] },
    { id: 'java', label: 'Java', name: 'Java', file: 'Main.java', mime: 'text/x-java', ext: ['java'] },
    { id: 'c', label: 'C', name: 'C', file: 'main.c', mime: 'text/x-csrc', ext: ['c', 'h'] },
    { id: 'cpp', label: 'C++', name: 'C++', file: 'main.cpp', mime: 'text/x-c++src', ext: ['cpp', 'cc', 'hpp'] },
    { id: 'csharp', label: 'C#', name: 'C#', file: 'Program.cs', mime: 'text/x-csharp', ext: ['cs'] },
    { id: 'go', label: 'Go', name: 'Go', file: 'main.go', mime: 'go', ext: ['go'] },
    { id: 'rust', label: 'Rust', name: 'Rust', file: 'main.rs', mime: 'rust', ext: ['rs'] },
    { id: 'php', label: 'PHP', name: 'PHP', file: 'index.php', mime: 'application/x-httpd-php', ext: ['php'] },
    { id: 'ruby', label: 'Ruby', name: 'Ruby', file: 'main.rb', mime: 'ruby', ext: ['rb'] },
    { id: 'swift', label: 'Swift', name: 'Swift', file: 'main.swift', mime: 'swift', ext: ['swift'] },
    { id: 'kotlin', label: 'Kotlin', name: 'Kotlin', file: 'Main.kt', mime: 'text/x-kotlin', ext: ['kt'] },
    { id: 'sql', label: 'SQL', name: 'SQL', file: 'query.sql', mime: 'text/x-sql', ext: ['sql'] },
    { id: 'bash', label: 'Bash', name: 'Bash', file: 'script.sh', mime: 'shell', ext: ['sh'] }
  ];
  const LANG = id => LANGS.find(l => l.id === id) || LANGS[0];
  const MODE_FILES = {
    htmlmixed: ['mode/xml/xml.min.js', 'mode/javascript/javascript.min.js', 'mode/css/css.min.js', 'mode/htmlmixed/htmlmixed.min.js'],
    python: ['mode/python/python.min.js'], javascript: ['mode/javascript/javascript.min.js'],
    clike: ['mode/clike/clike.min.js'], go: ['mode/go/go.min.js'], rust: ['addon/mode/simple.min.js', 'mode/rust/rust.min.js'],
    php: ['mode/xml/xml.min.js', 'mode/javascript/javascript.min.js', 'mode/css/css.min.js', 'mode/htmlmixed/htmlmixed.min.js', 'mode/clike/clike.min.js', 'mode/php/php.min.js'],
    ruby: ['mode/ruby/ruby.min.js'], swift: ['mode/swift/swift.min.js'], sql: ['mode/sql/sql.min.js'], shell: ['mode/shell/shell.min.js']
  };
  function modeKey(l) {
    const m = typeof l.mime === 'string' ? l.mime : l.mime.name;
    if (m.startsWith('text/x-c') || m === 'text/x-java' || m === 'text/x-kotlin') return 'clike';
    if (m === 'application/x-httpd-php') return 'php';
    if (m === 'text/x-sql') return 'sql';
    return m;
  }

  const MODEL_GROUPS = [
    ['DeepSeek', [['deepseek-flash', 'DeepSeek V4.1 Flash'], ['deepseek-v4-pro', 'DeepSeek V4 Pro'], ['deepseek-chat', 'DeepSeek V3'], ['deepseek-reasoner', 'DeepSeek Reasoner']]],
    ['Gemini (Google Cloud)', [['gemini:gemini-4-argon', 'Gemini 4 Argon'], ['gemini:gemini-3.8-flash', 'Gemini 3.8 Flash'], ['gemini:gemini-3.7-flash', 'Gemini 3.7 Flash'], ['gemini:gemini-3.1-pro-preview', 'Gemini 3.1 Pro']]],
    ['Claude', [['pplx:anthropic/claude-sonnet-5-5', 'Claude Sonnet 5.5'], ['pplx:anthropic/claude-opus-5-5', 'Claude Opus 5.5'], ['pplx:anthropic/claude-haiku-5-5', 'Claude Haiku 5.5'], ['pplx:anthropic/claude-haiku-4-5', 'Claude Haiku 4.5'], ['pplx:anthropic/claude-fable-5-1', 'Claude Fable 5.1']]],
    ['OpenAI', [['pplx:openai/gpt-6.1-sol', 'GPT-6.1 Sol'], ['pplx:openai/gpt-6-luna', 'GPT-6 Luna'], ['pplx:openai/gpt-5.6-terra', 'GPT-5.6 Terra'], ['pplx:openai/gpt-5.5', 'GPT-5.5']]],
    ['GLM', [['pplx:perplexity/glm-5.3-flash', 'GLM 5.3 Flash'], ['pplx:perplexity/glm-5.3', 'GLM 5.3']]],
    ['xAI', [['pplx:xai/grok-4.3', 'Grok 4.3'], ['pplx:xai/grok-4.7', 'Grok 4.7']]]
  ];

  // ---------- small helpers ----------
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const store = {
    get(k, d) { try { const v = localStorage.getItem('coding:' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem('coding:' + k, JSON.stringify(v)); } catch (e) {} }
  };
  const nfa = n => String(n).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);

  // =====================================================================
  //  PURE LOGIC: parse the model's answer, apply SEARCH/REPLACE edits, diff
  // =====================================================================
  function parseReply(raw) {
    const lines = String(raw || '').split('\n');
    const text = [], blocks = [];
    let open = null;
    for (const ln of lines) {
      const t = ln.trim();
      if (!open) {
        if (/^<{5,9}\s*SEARCH\s*$/i.test(t)) { open = { phase: 's', s: [], r: [] }; continue; }
        text.push(ln); continue;
      }
      if (open.phase === 's') {
        if (/^={5,9}\s*$/.test(t)) { open.phase = 'r'; continue; }
        open.s.push(ln); continue;
      }
      if (/^>{5,9}\s*REPLACE\s*$/i.test(t)) { blocks.push({ search: open.s.join('\n'), replace: open.r.join('\n') }); open = null; continue; }
      open.r.push(ln);
    }
    let body = text.join('\n');
    if (blocks.length || open) body = body.split('\n').filter(l => !/^\s*```\w*\s*$/.test(l)).join('\n');   // fences wrapped around edit blocks
    let full = null;
    if (!blocks.length && !open) {
      const m = /```[\w+#-]*\n([\s\S]*?)\n```/.exec(raw || '');
      if (m && m[1].split('\n').length >= 3) full = m[1];
      else {                                           // fence still open at the end of the stream
        const m2 = /```[\w+#-]*\n([\s\S]*)$/.exec(raw || '');
        if (m2 && !/\n```/.test(m2[0]) && m2[1].split('\n').length >= 3) full = null;
      }
    }
    return { text: body.trim(), blocks, partial: !!open, full, partialBlock: open ? { phase: open.phase, search: open.s.join('\n'), replace: open.r.join('\n') } : null };
  }

  const leadWS = s => (/^[ \t]*/.exec(s) || [''])[0];
  function findUnique(code, search) {
    if (!search || !search.trim()) return { err: 'empty' };
    let idx = code.indexOf(search);
    if (idx >= 0) {
      if (code.indexOf(search, idx + 1) >= 0) return { err: 'ambiguous' };
      return { start: idx, end: idx + search.length, reindent: null };
    }
    const cl = code.split('\n');
    const sl = search.split('\n');
    while (sl.length && !sl[0].trim()) sl.shift();
    while (sl.length && !sl[sl.length - 1].trim()) sl.pop();
    if (!sl.length) return { err: 'empty' };
    for (const mode of ['rtrim', 'trim']) {
      const norm = s => mode === 'rtrim' ? s.replace(/\s+$/, '') : s.trim();
      const ns = sl.map(norm);
      const hits = [];
      for (let i = 0; i + ns.length <= cl.length; i++) {
        let ok = true;
        for (let j = 0; j < ns.length; j++) if (norm(cl[i + j]) !== ns[j]) { ok = false; break; }
        if (ok) hits.push(i);
      }
      if (hits.length > 1) return { err: 'ambiguous' };
      if (hits.length === 1) {
        const i = hits[0];
        let start = 0;
        for (let k = 0; k < i; k++) start += cl[k].length + 1;
        let len = 0;
        for (let k = 0; k < ns.length; k++) len += cl[i + k].length + (k ? 1 : 0);
        return { start, end: start + len, reindent: mode === 'trim' ? { from: leadWS(sl[0]), to: leadWS(cl[i]) } : null };
      }
    }
    return { err: 'notfound' };
  }
  function applyBlocks(code, blocks) {
    let cur = code;
    const failed = [];
    let applied = 0;
    for (const b of blocks) {
      const f = findUnique(cur, b.search);
      if (f.err) { failed.push({ block: b, reason: f.err }); continue; }
      let rep = b.replace;
      if (f.reindent && f.reindent.from !== f.reindent.to) {
        rep = rep.split('\n').map(l => l.startsWith(f.reindent.from) ? f.reindent.to + l.slice(f.reindent.from.length) : l).join('\n');
      }
      cur = cur.slice(0, f.start) + rep + cur.slice(f.end);
      applied++;
    }
    return { code: cur, applied, failed };
  }
  // line diff (LCS) -> [{t:'ctx'|'add'|'del', s, n}] where n = line number in the NEW text for add/ctx
  function lineDiff(a, b) {
    const A = a.split('\n'), B = b.split('\n');
    let p = 0;
    while (p < A.length && p < B.length && A[p] === B[p]) p++;
    let q = 0;
    while (q < A.length - p && q < B.length - p && A[A.length - 1 - q] === B[B.length - 1 - q]) q++;
    const a2 = A.slice(p, A.length - q), b2 = B.slice(p, B.length - q);
    const ops = [];

  function failCard(failed, request) {
    const c = document.createElement('div'); c.className = 'card bad';
    c.innerHTML = '<div class="row"><b>⚠️ ' + nfa(failed.length) + ' تغییر اعمال نشد</b><span class="sp"></span><button type="button">از مدل بخواه کل کد را بازنویسی کند</button></div>';
    c.querySelector('button').onclick = () => ask('تغییرات قبلی اعمال نشد. همین درخواست را دوباره انجام بده و این بار کل برنامهٔ نهایی را در یک بلوک کد کامل بنویس: ' + request);
    return c;
  }
  function fullCard(full) {
    const c = document.createElement('div'); c.className = 'card';
    const cur = ed.get();
    c.innerHTML = '<div class="row"><b>مدل کل برنامه را دوباره نوشته (' + nfa(full.split('\n').length) + ' خط)</b><span class="sp"></span><button type="button" data-a="ok">جایگزین کد فعلی کن</button><button type="button" data-a="no">نادیده بگیر</button></div>';
    c.querySelector('[data-a=ok]').onclick = () => { ed.replace(full); ed.mark(rangesOf(lineDiff(cur, full))); persist(); updateMeta(); c.replaceWith(changeCard(cur, full, lineDiff(cur, full), 1, 1)); };
    c.querySelector('[data-a=no]').onclick = () => c.remove();
    return c;
  }

  // =====================================================================
  //  RUN (HTML preview, JavaScript and Python in a sandboxed iframe)
  // =====================================================================
  const out = $('out'), con = $('con'), preview = $('preview');
  let runId = 0, runTimer = null;
  function conLine(type, text) {
    if (con.querySelector('.empty')) con.innerHTML = '';
    const d = document.createElement('div'); d.className = type; d.textContent = text; con.appendChild(d); con.scrollTop = con.scrollHeight;
    if (lastRun && (type === 'err' || type === 'log' || type === 'warn')) { lastRun.lines.push({ type, text }); if (type === 'err') { lastRun.hasError = true; renderChips(); } }
  }
  function b64(s) { const bytes = new TextEncoder().encode(s); let bin = ''; for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(bin); }
  const HOOK = id => '<script>(function(){var ID=' + id + ';function p(t,x){try{parent.postMessage({cdRun:ID,type:t,text:String(x)},"*")}catch(e){}}' +
    'var f=function(a){return Array.prototype.map.call(a,function(x){try{return typeof x==="string"?x:(x instanceof Error?(x.stack||String(x)):JSON.stringify(x))}catch(e){return String(x)}}).join(" ")};' +
    'console.log=console.info=console.debug=function(){p("log",f(arguments))};console.warn=function(){p("warn",f(arguments))};console.error=function(){p("err",f(arguments))};' +
    'window.addEventListener("error",function(e){p("err",(e.message||"Error")+(e.lineno?" (line "+e.lineno+")":""))});' +
    'window.addEventListener("unhandledrejection",function(e){p("err","Promise: "+(e.reason&&e.reason.message||e.reason))});})();<\/script>';
  function htmlDoc(id, code) {
    const hook = HOOK(id);
    if (/<head[^>]*>/i.test(code)) return code.replace(/<head[^>]*>/i, m => m + hook);
    if (/<html[^>]*>/i.test(code)) return code.replace(/<html[^>]*>/i, m => m + hook);
    if (/^\s*<!doctype[^>]*>/i.test(code)) return code.replace(/^\s*<!doctype[^>]*>/i, m => m + hook);
    return hook + code;
  }
  function scriptDoc(id, kind, code) {
    const head = '<!doctype html><meta charset="utf-8"><script>const ID=' + id + ';const post=(type,text)=>parent.postMessage({cdRun:ID,type:type,text:String(text)},"*");' +
      'const CODE=new TextDecoder().decode(Uint8Array.from(atob("' + b64(code) + '"),c=>c.charCodeAt(0)));' +
      'const fmt=a=>a.map(x=>{try{return typeof x==="string"?x:(x instanceof Error?(x.stack||String(x)):JSON.stringify(x,null,2))}catch(e){return String(x)}}).join(" ");<\/script>';
    if (kind === 'js') return head + '<script>console.log=console.info=console.debug=(...a)=>post("log",fmt(a));console.warn=(...a)=>post("warn",fmt(a));console.error=(...a)=>post("err",fmt(a));' +
      'window.addEventListener("error",e=>{post("err",(e.message||"Error")+(e.lineno?" (line "+e.lineno+")":""));});' +
      'window.addEventListener("unhandledrejection",e=>post("err","Promise: "+(e.reason&&e.reason.message||e.reason)));' +
      '(async()=>{try{const AF=Object.getPrototypeOf(async function(){}).constructor;await new AF(CODE)();}catch(e){post("err",e&&e.stack?e.stack:e);}setTimeout(()=>post("done",""),250);})();<\/script>';
    return head + '<script src="' + PYODIDE_URL + '"><\/script><script>(async()=>{try{post("status","در حال آماده‌سازی پایتون (بار اول چند ثانیه طول می‌کشد)…");const py=await loadPyodide();' +
      'py.setStdout({batched:s=>post("log",s)});py.setStderr({batched:s=>post("err",s)});py.setStdin({stdin:()=>undefined});post("status","در حال اجرا…");' +
      'await py.loadPackagesFromImports(CODE);await py.runPythonAsync(CODE);}catch(e){post("err",e&&e.message?e.message:e);}post("done","");})();<\/script>';
  }
  function stopRun() { clearTimeout(runTimer); runTimer = null; runId++; preview.removeAttribute('srcdoc'); const old = $('runFrame'); if (old) old.remove(); }
  function runCode() {
    if (!lang.run) return;
    const code = ed.get();
    if (!code.trim()) { openOut(); con.innerHTML = '<div class="empty">ادیتور خالی است.</div>'; return; }
    stopRun();
    const id = runId;
    lastRun = { lang: lang.id, lines: [], hasError: false, sent: false };
    con.innerHTML = ''; openOut();
    out.classList.toggle('html', lang.run === 'html');
    $('outSt').textContent = '· در حال اجرا…';
    if (lang.run === 'html') {
      preview.srcdoc = htmlDoc(id, code);
      runTimer = setTimeout(() => { $('outSt').textContent = '· پیش‌نمایش'; }, 600);
      if (!con.children.length) con.innerHTML = '<div class="empty">خطاها و console.log صفحه اینجا نشان داده می‌شود.</div>';
    } else {
      const f = document.createElement('iframe'); f.id = 'runFrame'; f.style.display = 'none'; f.setAttribute('sandbox', 'allow-scripts');
      f.srcdoc = scriptDoc(id, lang.run, code); document.body.appendChild(f);
      const limit = lang.run === 'py' ? 60000 : 15000;
      runTimer = setTimeout(() => { conLine('err', 'زمان اجرا تمام شد (' + nfa(limit / 1000) + ' ثانیه) و اجرا متوقف شد.'); stopRun(); $('outSt').textContent = '· متوقف شد'; }, limit);
    }
    renderChips();
  }
  window.addEventListener('message', e => {
    const d = e.data; if (!d || typeof d !== 'object' || d.cdRun !== runId) return;
    if (d.type === 'status') { $('outSt').textContent = '· ' + d.text; return; }
    if (d.type === 'done') { clearTimeout(runTimer); $('outSt').textContent = lastRun && lastRun.hasError ? '· با خطا تمام شد' : '· تمام شد'; if (!con.children.length) con.innerHTML = '<div class="empty">(بدون خروجی)</div>'; const rf = $('runFrame'); if (rf) setTimeout(() => rf.remove(), 50); return; }
    conLine(d.type, d.text);
  });
  function openOut() { out.classList.remove('collapsed'); $('outTog').textContent = '▼'; ed.refresh(); }
  $('outTog').onclick = () => { out.classList.toggle('collapsed'); $('outTog').textContent = out.classList.contains('collapsed') ? '▲' : '▼'; ed.refresh(); };
  $('outClear').onclick = () => { con.innerHTML = ''; };

  function syncLangUI() {
    $('runBtn').disabled = !lang.run;
    $('runBtn').title = lang.run ? 'اجرا (Ctrl+Enter)' : 'اجرا فقط برای HTML، JavaScript و Python ممکن است؛ برای این زبان دانلود کن و روی کامپیوترت اجرا کن';
    out.classList.toggle('html', lang.run === 'html');
  }

  // =====================================================================
  //  toolbar actions
  // =====================================================================
  function fileName() {
    if (lang.id === 'html') { const m = /<title[^>]*>([^<]{1,40})<\/title>/i.exec(ed.get()); if (m && /[\w؀-ۿ]/.test(m[1])) return m[1].trim().replace(/[\\/:*?"<>|]+/g, '-') + '.html'; }
    return lang.file;
  }
  $('dlBtn').onclick = () => {
    const v = ed.get(); if (!v.trim()) return;
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([v], { type: 'text/plain;charset=utf-8' })); a.download = fileName();
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  };
  $('cpBtn').onclick = async () => {
    const v = ed.get(); if (!v) return;
    try { await navigator.clipboard.writeText(v); } catch (e) { const t = document.createElement('textarea'); t.value = v; document.body.appendChild(t); t.select(); try { document.execCommand('copy'); } catch (x) {} t.remove(); }
    const b = $('cpBtn'); b.textContent = '✔ کپی شد'; setTimeout(() => b.textContent = '📋 کپی', 1200);
  };
  $('openBtn').onclick = () => $('fileIn').click();
  $('fileIn').onchange = async () => {
    const f = $('fileIn').files[0]; $('fileIn').value = ''; if (!f) return;
    if (f.size > 300000) { addMsg('err', null).textContent = 'فایل بزرگ است (بیشتر از ۳۰۰ کیلوبایت).'; return; }
    const text = await f.text();
    const ext = (f.name.split('.').pop() || '').toLowerCase();
    const l = LANGS.find(x => x.ext.includes(ext));
    if (ed.get().trim() && !confirm('کد فعلی با این فایل جایگزین شود؟')) return;
    if (l) await setLang(l.id);
    ed.set(text); persist(); updateMeta(); addMsg('sys', 'فایل «' + f.name + '» باز شد.');
  };
  $('newBtn').onclick = () => { if (ed.get().trim() && !confirm('کد پاک شود و از نو شروع کنیم؟')) return; ed.set(''); stopRun(); con.innerHTML = ''; lastRun = null; persist(); updateMeta(); renderChips(); ed.focus(); };
  $('runBtn').onclick = runCode;
  async function setLang(id) {
    lang = LANG(id); langSel.value = lang.id; store.set('lang', lang.id);
    await ensureMode(lang); ed.setMode(lang); syncLangUI();
  }
  langSel.onchange = () => setLang(langSel.value);
  modelSel.onchange = () => store.set('model', modelSel.value);
  $('deep').onchange = () => store.set('deep', $('deep').checked);
  $('aiClear').onclick = () => { if (streaming) return; hist = []; msgs.innerHTML = ''; greet(); };

  // composer
  const inp = $('inp');
  function autosize() { inp.style.height = 'auto'; inp.style.height = Math.min(150, inp.scrollHeight) + 'px'; }
  function submit() {
    if (streaming) { if (controller) controller.abort(); return; }
    const t = inp.value.trim(); if (!t) return;
    inp.value = ''; autosize(); ask(t);
  }
  inp.addEventListener('input', autosize);
  inp.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); submit(); } });
  $('send').onclick = submit;

  // layout: splitter, swap, phone tabs
  (function layout() {
    const work = $('work'), edPane = $('edPane'), split = $('split');
    const w = store.get('split', 50); edPane.style.flexBasis = w + '%';
    if (store.get('swap', false)) work.classList.add('swap');
    $('swapBtn').onclick = () => { work.classList.toggle('swap'); store.set('swap', work.classList.contains('swap')); ed.refresh(); };
    let drag = false;
    split.addEventListener('mousedown', e => { drag = true; split.classList.add('drag'); document.body.style.userSelect = 'none'; e.preventDefault(); });
    window.addEventListener('mousemove', e => {
      if (!drag) return;
      const r = work.getBoundingClientRect(); let p = ((e.clientX - r.left) / r.width) * 100;
      if (work.classList.contains('swap')) p = 100 - p;
      p = Math.max(25, Math.min(75, p)); edPane.style.flexBasis = p + '%'; store.set('split', Math.round(p)); ed.refresh();
    });
    window.addEventListener('mouseup', () => { if (drag) { drag = false; split.classList.remove('drag'); document.body.style.userSelect = ''; ed.refresh(); } });
    $('tabs').querySelectorAll('button').forEach(b => b.onclick = () => {
      document.body.dataset.tab = b.dataset.t;
      $('tabs').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); ed.refresh();
    });
  })();

  function greet() {
    addMsg('sys', 'کد را همین‌جا بنویس یا بچسبان، یا از من بخواه برنامه بنویسد. هر وقت بگویی «این را عوض کن»، فقط همان قسمت را تغییر می‌دهم و بقیهٔ کد را دست نمی‌زنم.<br>' +
      'مثال: «یک ماشین‌حساب ساده با HTML بساز» — بعدش: «دکمهٔ پاک کردن را قرمز کن».');
  }

  // =====================================================================
  //  start
  // =====================================================================
  (async function start() {
    await initEditor();
    await ensureMode(lang); ed.setMode(lang);
    ed.set(store.get('code', ''));
    ed.onChange(() => { persist(); updateMeta(); });
    ed.onCursor(updateMeta);
    syncLangUI(); updateMeta(); renderChips(); greet();
    window.__coding.ed = ed;           // used by the automatic tests
    window.__coding.ready = true;
  })();
})();
</script>
</body>
</html>
